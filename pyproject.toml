[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gnc-lite"
version = "1.0.0"
description = "Contabilidade de partidas dobradas simples para pequenos negocios"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "SQLAlchemy>=2.0",
    "flask>=3.0",
    "pywebview>=4.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "alembic>=1.13"]
build = ["pyinstaller>=6.0"]

[project.scripts]
gnc-lite = "gnc_lite.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gnc_lite"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
