[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "money99"
version = "0.1.0"
description = "Gerenciador financeiro pessoal Money 2026 (partidas dobradas simples)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "SQLAlchemy>=2.0",
    "flask>=3.0",
    "pywebview>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
build = ["pyinstaller>=6.0"]

[project.scripts]
money99 = "money99.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/money99"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
